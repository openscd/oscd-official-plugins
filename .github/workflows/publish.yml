name: Build and Deploy Plugins

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}
    steps:
      - name: Checkout Repository (with Submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18


      - name: Cache Main Project Dependencies
        uses: actions/cache@v4
        id: main-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-main-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-main-node-

      - name: Install Dependencies
        if: steps.main-cache.outputs.cache-hit != 'true'
        run: npm install


      - name: Cache Submodule Dependencies
        uses: actions/cache@v4
        id: submodule-cache
        with:
          path: openscd/node_modules
          key: ${{ runner.os }}-submodule-node-${{ hashFiles('openscd/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-submodule-node-

      - name: Install Submodule Dependencies
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        run: npm install
        working-directory: openscd


      - name: Build Submodule
        run: npm run build
        working-directory: openscd

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Debug
        run: |
          pwd
          ls -l
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: plugins
